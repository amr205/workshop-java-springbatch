spring.application.name=torres-spring

# Puerto del servidor Tomcat embebido (por defecto es 8080)
server.port=9090

# Propiedades propias de nuestra aplicacion
juego.nombre=Workshop Tower Defense
juego.presupuesto-inicial=250

# Muestra en consola el SQL que genera Hibernate
spring.jpa.show-sql=true

# Clave para firmar los JWT (minimo 32 caracteres para HS256).
# En produccion NUNCA va en el codigo: se lee de una variable de entorno.
jwt.secreto=cambia-esta-clave-secreta-de-al-menos-32-caracteres
jwt.expiracion-minutos=15
